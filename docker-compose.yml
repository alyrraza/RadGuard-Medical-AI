version: "3.9"

services:
  backend:
    build:
      context: ../RadGuard-AI-Engine
      dockerfile: ../RadGuard-Medical-AI/backend/Dockerfile
    image: radguard-backend:latest
    container_name: radguard-backend
    ports:
      - "8000:8000"
    volumes:
      - model_weights:/app/weights
      - heatmap_results:/workspace/results
    environment:
      - MODEL_PATH=/app/weights/best_model_v11.pth
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    image: radguard-frontend:latest
    container_name: radguard-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.0
    container_name: radguard-mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow ui
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --host 0.0.0.0
      --port 5000
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: radguard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: radguard-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  model_weights:
  heatmap_results:
  mlflow_data:
  prometheus_data:
  grafana_data:
